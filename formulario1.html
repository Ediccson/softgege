<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formularios</title>
</head>
<body>
    <form>
        <h1>Formulario</h1>
        Nombre: <br>
        <input type="text" name="nombre"><br>
         Apellido: <br>
        <input type="text" name="apellido"><br>
         Email: <br>
        <input type="email" name="email"><br><br>
          Fecha Nacimiento: <br>
        <input type="date" name="fechanacimiento"><br><br>
         Anexe su documento de identidad: <br>
        <input type="file" name="archivo"><br><br>
         Seleccione país a visitar: <br>
        <input type="checkbox" name="pais1" value="Mexico">México<br>
        <input type="checkbox" name="pais2" value="Colombia">Colombia<br>
        <input type="checkbox" name="pais3" value="Argentina">Argentina<br><br>
        
        <input type="submit" value="Enviar">
    </form>
</body>
</html>
